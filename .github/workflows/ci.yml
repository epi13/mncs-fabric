name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: mncs-fabric artifacts verify examples/portable-python/bundle examples/portable-python/artifact-manifest.json
      - run: mncs-fabric plan validate examples/portable-python/job-plan.json
      - run: python -c "from pathlib import Path; Path('build').mkdir(exist_ok=True)"
      - run: mncs-fabric run local examples/portable-python/job-plan.json --root examples/portable-python/bundle --manifest examples/portable-python/artifact-manifest.json --label ci-${{ matrix.os }}-${{ matrix.python }} --output build/example-record.json --results-dir build/results
      - run: mncs-fabric record verify build/example-record.json
      - run: mncs-fabric reconcile build/example-record.json --output build/example-cohort.json
      - run: mncs-fabric record verify build/example-cohort.json
